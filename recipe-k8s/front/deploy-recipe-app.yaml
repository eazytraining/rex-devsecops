---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recipe-frontend
  labels:
    app: recipe
    tier: frontend
spec:
  replicas: 2                                  # haute dispo recommandée
  selector:
    matchLabels:
      app: recipe
      tier: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: recipe
        tier: frontend
    spec:
      containers:
      - name: recipe-app
        image: blondel/frontend:v1
        imagePullPolicy: IfNotPresent
        env:
        - name: API_URL
          valueFrom:
            configMapKeyRef:
              name: recipe-frontend-config
              key: API_URL
        ports:
        - containerPort: 80
          name: app-port
        # resources:
        #   requests:
        #     memory: "128Mi"
        #     cpu: "100m"
        #   limits:
        #     memory: "256Mi"
        #     cpu: "250m"
      restartPolicy: Always