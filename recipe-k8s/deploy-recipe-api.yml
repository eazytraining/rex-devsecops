apiVersion: apps/v1
kind: Deployment
metadata:
  name: recipe-backend
  labels:
    app: recipe
spec:
  selector:
    matchLabels:
      app: recipe
      tier: backend
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: recipe
        tier: backend
    spec:
      containers:
      #- image: olivierkkoc/recipe-backend:demo
      - image: blondel/api      
        name: recipe-api
        env:        
        - name: SPRING_DATASOURCE_URL
          value: jdbc:mysql://recipe-mysql:3306/recipe_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
        - name: FRONTEND_URL
          value: http://54.152.219.126:30080
        - name: SPRING_DATASOURCE_USERNAME
          value: recipe_user
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-pass
              key: mysql-recipe-pass
        - name: SPRING_APPLICATION_NAME
          value: recipe-demo
        ports:
        - containerPort: 8080
        - containerPort: 8443        
          name: api-port
