---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phpmyadmin
  namespace: recipe-ns
  labels:
    app: phpmyadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phpmyadmin
  template:
    metadata:
      labels:
        app: phpmyadmin
    spec:
      containers:
      - name: phpmyadmin
        image: phpmyadmin/phpmyadmin:5.2.1
        ports:
        - containerPort: 80
        env:
        - name: PMA_HOST
          value: recipe-mysql
        - name: PMA_PORT
          value: "3306"
        - name: PMA_USER
          value: root
        - name: PMA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-pass
              key: mysql-root-pass
