apiVersion: v1
kind: Service
metadata:
  name: recipe-api
  labels:
    app: recipe
    tier: svc-backend
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30088
    - name: https
      port: 8443
      targetPort: 8443
      nodePort: 30443
  selector:
    tier: backend
  type: NodePort
