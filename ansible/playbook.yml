---
- name: Déployer toute la stack Docker
  hosts: prod
  become: true

  vars:
    tag_api: v1
    tag_front: v1
    api_container: api
    frontend_container: frontend
    api_src_path: "{{ lookup('env','HOME') }}/deploy/recipe-api"
    frontend_src_path: "{{ lookup('env','HOME') }}/deploy/recipe-app"
    docker_version: "5:28.2.2-1~ubuntu.24.04~noble"
    public_ip: "MY_HOST_ADDRESS"
    dockerhub_username: "votre_username_dockerhub"
    ## ansible-vault encrypt_string 'votre_mot_de_passe' --name 'vault_dockerhub_password'
    dockerhub_password: "{{ vault_dockerhub_password }}"


  pre_tasks:
    - name: Vérifier si Docker est installé
      command: docker --version
      register: docker_check
      failed_when: false
      changed_when: false

    - name: Installer Docker si nécessaire
      include_role:
        name: roles/docker-install
      when: docker_check.rc != 0

  roles:
    - roles/installation
    - roles/build
    - roles/deploy
